[workspace]
members = [
  "crates/sauce-api",
  "crates/sauce-core",
  "crates/sauce-db",
  "crates/sauce-indexer",
  "crates/sauce-supervisor",
  "crates/sauce-telegram"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
qdrant-client = "1.15"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["hickory-dns", "json", "multipart", "rustls-tls", "socks", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
