lor:var(--ok);border-radius:99px;padding:4px 10px;font-size:12px}.pill.wait{color:var(--muted);border-color:var(--line)}.pill.bad{color:var(--alarm);border-color:#ff5d7a73}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--faint);font-weight:500;font-size:12px;padding:10px 8px}td{padding:12px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}td.num,th.num{text-align:right}.path{color:var(--teal)}.empty{color:var(--muted);margin:8px 0 0}.tiles{display:grid;grid-template-columns:repeat(5,1fr)}.tile{padding:8px 12px}.tile+.tile{border-left:1px solid var(--line)}.tile dt{display:flex;gap:8px;align-items:center}.tile dd{margin:10px 0 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}.flash{margin:0 0 12px;color:var(--teal)}.grid-2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}fieldset{border:0;margin:0 0 8px;padding:0}legend{font-size:18px;font-weight:650;margin-bottom:12px}.check{display:flex;align-items:center;gap:8px;color:var(--text)}.check input{width:auto}.hit{padding:10px 0;border-top:1px solid var(--line)}.hit a{color:var(--teal)}@media(max-width:960px){.shell{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}nav a{white-space:nowrap}.metrics,.tiles,.grid-2,.fields{grid-template-columns:1fr}.tile+.tile{border-left:0;border-top:1px solid var(--line)}main{padding:20px 16px 40px}.hide-sm{display:none}}</style>
