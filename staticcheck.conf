# 기본 검사를 전부 켜고, 아래 둘만 끕니다.
#
# ST1005는 오류 문구가 대문자로 시작하지 말라는 규칙입니다.
# 영어에서 "failed to X: Something broke"처럼 감쌌을 때 어색해지는 것을 막기
# 위한 것이며, 고유명사는 Go 공식 지침에서도 예외로 둡니다.
# 이 저장소의 오류 문구는 한국어이고 "Qdrant에 닿지 못했습니다"처럼 어느 부품이
# 문제인지 먼저 밝힙니다. "벡터 저장소"로 바꾸면 무엇을 손봐야 할지 알 수 없어집니다.
#
# ST1020, ST1021, ST1022는 문서 주석이 이름 뒤에 빈칸을 두고 시작하라는 규칙입니다.
# 한국어는 이름에 조사가 바로 붙습니다. "Doer는 실제 요청을 보내는 쪽입니다"가
# 자연스럽고, 규칙을 지키려면 "Doer 는"처럼 어색하게 띄워야 합니다.
# 주석 자체는 모든 공개 항목에 붙어 있습니다.
checks = ["all", "-ST1005", "-ST1020", "-ST1021", "-ST1022"]
